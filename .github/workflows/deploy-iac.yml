name: Deploy IaC

on:
  push:
    branches: [ main ]
    paths: [ '09-iac-automation/scripts/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '09-iac-automation/scripts/**' ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (preview on PR)
        if: github.event_name == 'pull_request'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if -g rg-iac-lab-eastus-01 --template-file 09-iac-automation/scripts/storage.bicep

      - name: Deploy (on merge to main)
        if: github.event_name == 'push'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create -g rg-iac-lab-eastus-01 --template-file 09-iac-automation/scripts/storage.bicep --name gh-deploy-${{ github.run_number }}